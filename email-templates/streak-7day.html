<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-Day Streak</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; background-color: #0D0D0D; font-family: 'Rajdhani', sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #0D0D0D;">
        <tr>
            <td align="center" style="padding: 40px 20px;">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color: #1A1A1A; border-radius: 8px; border: 1px solid #00BFFF;">
                    <tr>
                        <td style="padding: 30px; text-align: center; border-bottom: 2px solid #00BFFF;">
                            <h1 style="font-family: 'Orbitron', sans-serif; color: #00BFFF; margin: 0; font-size: 32px;">OD9</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 40px 30px; text-align: center;">
                            <div style="width: 100px; height: 100px; background: linear-gradient(135deg, #FF6B35, #FF4500); border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
                                <span style="font-size: 50px;">🔥</span>
                            </div>
                            <h2 style="font-family: 'Orbitron', sans-serif; color: #FF6B35; margin: 0 0 20px; font-size: 28px;">7-DAY STREAK!</h2>
                            <p style="color: #CCCCCC; font-size: 18px; line-height: 1.6; margin: 0 0 20px;">
                                {{username}}, you've shown up 7 days in a row.
                            </p>
                            <p style="color: #CCCCCC; font-size: 16px; line-height: 1.6; margin: 0 0 20px;">
                                Consistency is everything. While others come and go, you're building something. That kind of dedication gets rewarded.
                            </p>
                            <div style="background-color: #0D0D0D; padding: 20px; border-radius: 6px; margin: 20px 0;">
                                <p style="color: #FF6B35; font-family: 'Orbitron', sans-serif; font-size: 14px; margin: 0 0 10px;">STREAK BONUS</p>
                                <p style="color: #FFD700; font-size: 24px; font-family: 'Orbitron', sans-serif; margin: 0;">+50 CREDITS</p>
                            </div>
                            <p style="color: #999; font-size: 14px; line-height: 1.6;">
                                Keep the fire burning. Next milestone: <strong style="color: #FF6B35;">30-day streak</strong>
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 20px 30px; background-color: #0D0D0D; border-top: 1px solid #333; text-align: center;">
                            <p style="color: #666; font-size: 12px; margin: 0;">
                                <a href="{{unsubscribe_url}}" style="color: #00BFFF; text-decoration: none;">Unsubscribe</a> |
                                <a href="https://offda9.com" style="color: #00BFFF; text-decoration: none;">offda9.com</a>
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
